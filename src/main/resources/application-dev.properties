server.port=8081
student.portal.name=Student Portal - Development
student.portal.max-students=100
student.portal.active=true
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/student_management?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.security.user.name=${STUDENT_API_USER:student-writer}
spring.security.user.password=${STUDENT_API_PASSWORD:local-demo-password}
spring.security.user.roles=STUDENT_WRITER
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true